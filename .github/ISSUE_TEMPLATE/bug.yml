name: Bug report
description: Report a reproducible workflow editor bug.
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest document, code sample, or interaction sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "@moritzbrantner/workflow-editor@0.1.1"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or runtime
      placeholder: "Chrome 126, Safari 18, Node 24"
  - type: dropdown
    id: validation-mode
    attributes:
      label: Validation mode
      options:
        - strict
        - repair
        - not applicable
    validations:
      required: true
