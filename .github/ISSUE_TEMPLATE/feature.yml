name: Feature request
description: Propose an improvement to the workflow editor.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or integration problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the API, UI, or behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable behavior or tests that would make this complete.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "@moritzbrantner/workflow-editor@0.1.1"
