version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      testing:
        patterns:
          - "@axe-core/*"
          - "@playwright/*"
          - "@testing-library/*"
          - "@vitest/*"
          - "jsdom"
          - "vitest"
      build:
        patterns:
          - "@microsoft/api-extractor"
          - "@storybook/*"
          - "@tailwindcss/*"
          - "storybook"
          - "tailwindcss"
          - "tsd"
          - "tsup"
          - "typescript"
          - "vite"
      lint-format:
        patterns:
          - "oxfmt"
          - "oxlint"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
