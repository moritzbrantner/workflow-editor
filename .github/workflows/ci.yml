name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      format_command: bun run format && git diff -- examples/workbench/src/mobile.ts examples/workbench/src/styles.css && false
      lint_command: bun run lint
      typecheck_command: bun run check-types && bun run check-types:tests && bun run api:check && bun run types:public
      build_command: bun run build
      unit_test_command: bun run test && bun run coverage:check
      timeout_minutes: 45
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  integration-validation:
    name: Integration Validation
    needs: fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      integration_command: bun run build && bun run example:build
      package_check_command: bun run smoke:package && bun run smoke:packed-consumer && bun run pack:check
      timeout_minutes: 30
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  e2e-validation:
    name: E2E Validation
    needs: fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      install_playwright: true
      e2e_command: bun run test:playwright
      timeout_minutes: 45
      artifact_paths: |
        playwright-report
        test-results
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  storybook-validation:
    name: Storybook Validation
    needs: fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/storybook-validation.yml@workflow-standard-v1
    with:
      bun_version: "1.3.14"
      install_command: bun install --frozen-lockfile
      storybook_build_command: bun run storybook:build
      timeout_minutes: 30
      artifact_paths: storybook-static
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
