name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@0415977e9d98d7708ee0e094ed558c95ff72b3bc # workflow-standard-v1
    with:
      bun_version: "1.4.3"
      install_command: bun install --frozen-lockfile
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check-types && bun run check-types:tests && bun run api:check && bun run types:public
      build_command: bun run build
      unit_test_command: bun run test && bun run coverage:check
      timeout_minutes: 45

  integration-validation:
    name: Integration Validation
    needs: fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@0415977e9d98d7708ee0e094ed558c95ff72b3bc # workflow-standard-v1
    with:
      bun_version: "1.4.3"
      install_command: bun install --frozen-lockfile
      integration_command: bun run build && bun run example:build
      package_check_command: bun run smoke:package && bun run smoke:packed-consumer && bun run pack:check && bun run verify:git-install
      timeout_minutes: 30

  e2e-validation:
    name: E2E Validation
    needs: fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/e2e-validation.yml@0415977e9d98d7708ee0e094ed558c95ff72b3bc # workflow-standard-v1
    with:
      bun_version: "1.4.3"
      install_command: bun install --frozen-lockfile
      install_playwright: true
      e2e_command: bun run test:playwright
      timeout_minutes: 45
      artifact_paths: |
        playwright-report
        test-results

  storybook-validation:
    name: Storybook Validation
    needs: fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/storybook-validation.yml@0415977e9d98d7708ee0e094ed558c95ff72b3bc # workflow-standard-v1
    with:
      bun_version: "1.4.3"
      install_command: bun install --frozen-lockfile
      storybook_build_command: bun run storybook:build
      timeout_minutes: 30
      artifact_paths: storybook-static

  pr-scope:
    outputs:
      allow-skipped: ${{ steps.merge-scope.outputs.allow-skipped }}
      validate-source-validation: ${{ steps.merge-scope.outputs.validate-source-validation }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Determine required PR validation scope
        id: merge-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]).decode().split("\0")
          filters = {'validate-source-validation': {'paths': ['.github/workflows/source-validation.yml', 'package.json', 'bun.lock', 'scripts/**', 'src/**', 'examples/**'], 'branches': None}}
          def matches(path, pattern):
              pattern = re.escape(pattern).replace(r"\*\*", ".*").replace(r"\*", "[^/]*").replace(r"\?", "[^/]")
              return re.fullmatch(pattern, path) is not None
          skipped = []
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, scope in filters.items():
                  matches_paths = scope["paths"] is None or any(matches(path, pattern) for path in paths if path for pattern in scope["paths"])
                  matches_branch = scope["branches"] is None or any(matches(os.environ["BASE_BRANCH"], pattern) for pattern in scope["branches"])
                  required = matches_paths and matches_branch
                  print(f"{name}={str(required).lower()}", file=output)
                  if not required:
                      skipped.append(name)
              print("allow-skipped=" + json.dumps(skipped), file=output)
          PYTHON

  validate-source-validation:
    needs: pr-scope
    if: github.event_name == 'pull_request' && needs.pr-scope.outputs.validate-source-validation == 'true'
    uses: ./.github/workflows/source-validation.yml
    permissions:
      contents: read

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      [
        "fast-validation",
        "integration-validation",
        "e2e-validation",
        "storybook-validation",
        "pr-scope",
        "validate-source-validation",
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["fast-validation", "integration-validation", "e2e-validation", "storybook-validation", "pr-scope", "validate-source-validation"]'
          allow-skipped: ${{ needs.pr-scope.outputs.allow-skipped || '[]' }}
