name: Compiler Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Show compiler formatter diff
        run: |
          bunx oxfmt src/compiler.ts
          git diff --exit-code -- src/compiler.ts
