name: Performance

on:
  # Full benchmarks run on main or on explicit request, not on every PR.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  performance-validation:
    name: Performance Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@0415977e9d98d7708ee0e094ed558c95ff72b3bc # workflow-standard-v1
    with:
      bun_version: "1.4.3"
      install_command: bun install --frozen-lockfile
      build_command: bun run build
      benchmark_command: bun run bench
      artifact_paths: benchmark-results
      timeout_minutes: 30
