name: Source Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-source:
    runs-on: ubuntu-latest
    env:
      GRAPH_EDITOR_SOURCE: ${{ github.workspace }}/.source/graph-editor
      EDITOR_CORE_SOURCE: ${{ github.workspace }}/.source/editor-core
    steps:
      - name: Check out workflow-editor
        uses: actions/checkout@v6

      - name: Check out graph-editor source
        uses: actions/checkout@v6
        with:
          repository: moritzbrantner/graph-editor
          path: .source/graph-editor

      - name: Check out editor-core source
        uses: actions/checkout@v6
        with:
          repository: moritzbrantner/editor-core
          path: .source/editor-core

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Prepare recursive graph source
        run: bun run source:prepare

      - name: Smoke-test graph source resolution
        run: bun run source:smoke

      - name: Report active source
        if: always()
        run: bun run source:status
